<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>MIKO.TODO selftest</title>
<style>
  body { font: 13px/1.5 -apple-system, sans-serif; margin: 12px; }
  #out { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .ok { color: #15803d; } .bad { color: #b91c1c; }
  iframe { width: 1180px; height: 760px; border: 1px solid #ddd; margin-top: 10px; }
</style>
</head>
<body>
<h1>MIKO.TODO 工作台自测</h1>
<div id="out">running…</div>
<iframe id="frame" src="../ui/index.html"></iframe>
<script>
(function () {
  const out = document.getElementById("out");
  const lines = [];
  const errors = [];
  let pass = 0, fail = 0;
  const frame = document.getElementById("frame");

  function log(text, ok) {
    if (ok === true) pass++; else if (ok === false) fail++;
    lines.push((ok === true ? "PASS " : ok === false ? "FAIL " : "     ") + text);
    out.textContent = lines.join("\n");
  }
  function eq(actual, expected, label) {
    log(label + " → " + JSON.stringify(actual) + (actual === expected ? "" : " (期望 " + JSON.stringify(expected) + ")"), actual === expected);
  }
  function truthy(v, label) { log(label + " → " + JSON.stringify(v), !!v); }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  frame.addEventListener("load", async () => {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    win.addEventListener("error", (e) => errors.push(String(e.message)));
    win.addEventListener("unhandledrejection", (e) => errors.push("rejection: " + String(e.reason)));
    await wait(400);

    const $ = (sel, root) => (root || doc).querySelector(sel);
    const $$ = (sel, root) => Array.from((root || doc).querySelectorAll(sel));
    const fire = (node, type) => node.dispatchEvent(new win.Event(type, { bubbles: true }));

    try {
      // 1. 外壳与默认分组
      eq($("#shell").hidden, false, "工作台外壳可见");
      eq($$("#groups .group-item").length, 3, "默认 3 个分组");
      eq($$("#smart .smart-item").length, 4, "4 条智能列表");

      // 2. 新建任务 → 详情面板
      $("#btn-new").click();
      await wait(80);
      eq($("#modal-root").hidden, false, "新建任务打开详情面板");
      const title = $(".sheet-title");
      truthy(title, "详情面板有标题输入");

      // 3. 编辑标题 + 优先级 + 日期
      title.value = "写周报";
      fire(title, "input");
      const priSel = $$(".sheet .select")[1];
      priSel.value = "high";
      fire(priSel, "change");
      const dateInputs = $$('.sheet input[type="date"]');
      dateInputs[0].value = "2026-11-20";
      fire(dateInputs[0], "change");
      dateInputs[1].value = "2026-11-27";
      fire(dateInputs[1], "change");
      await wait(60);

      // 4. 子任务两个 + 勾一个
      const subInput = $$(".sheet .list-add")[0].querySelector(".input");
      const subBtn = $$(".sheet .list-add")[0].querySelector("button");
      subInput.value = "收集数据";
      subBtn.click();
      subInput.value = "写结论";
      subBtn.click();
      await wait(60);
      eq($$(".sheet .entry-row").length, 2, "两个子任务行");
      const firstCheck = $(".sheet .entry-row .mini-check");
      firstCheck.click();
      await wait(60);
      eq($$(".sheet .entry-row .mini-check")[0].getAttribute("aria-checked"), "true", "子任务勾选成功");
      eq($(".progress-card .pc-pct").textContent, "50%", "进度按检查点算 50%");

      // 5. 重复：每周 + 周一/周三
      const freqSel = $$(".sheet .select")[2];
      eq(freqSel.value, "none", "默认不重复");
      freqSel.value = "weekly";
      fire(freqSel, "change");
      await wait(60);
      const wdBtns = $$(".sheet .wd-btn");
      eq(wdBtns.length, 7, "每周出现 7 个星期按钮");
      wdBtns[1].click();
      wdBtns[3].click();
      await wait(60);
      truthy($(".sheet .hint").textContent.indexOf("下次") >= 0 || $$(".sheet .hint").some((n) => n.textContent.indexOf("下次") >= 0), "给出下次重复日期");

      // 6. 关面板 → 列表出现任务
      $(".sheet-foot .btn-primary").click();
      await wait(80);
      eq($("#modal-root").hidden, true, "关闭详情面板");
      eq($$(".task").length, 1, "列表出现 1 个任务");
      eq($(".task").dataset.pri, "high", "优先级高写入列表");
      truthy($(".task").textContent.indexOf("写周报") >= 0, "列表显示标题");
      truthy($(".task").textContent.indexOf("1/2") >= 0, "列表显示子任务 1/2");
      truthy($(".task-progress .pct").textContent === "50%", "列表进度 50%");
      truthy($(".task .chip.repeat"), "列表显示重复图标");

      // 7. 勾选完成 → 100% 且生成下一次
      $(".task .check").click();
      await wait(150);
      eq($$(".task[data-done='true']").length, 0, "完成后默认隐藏已完成");
      eq($$(".task").length, 1, "完成后列表只剩下一次实例");
      eq($(".task").dataset.done, "false", "下一次实例是未完成状态");
      $("#btn-show-done").click();
      await wait(150);
      eq($$(".task").length, 2, "显示已完成后：原实例 + 下一次");
      eq($$(".task[data-done='true']").length, 1, "原实例保持完成状态");
      eq($(".task[data-done='true'] .task-progress .pct").textContent, "100%", "完成度 100%");

      // 8. 日历视图
      $('.seg-btn[data-view="calendar"]').click();
      await wait(120);
      eq($("#calendar-view").hidden, false, "日历视图可见");
      eq($$("#cal-weekdays span").length, 7, "日历表头 7 列");
      eq($$("#cal-grid .cal-cell").length, 42, "月历 42 格");
      const covered = $$("#cal-grid .cal-chip").length;
      truthy(covered >= 1, "日历里有任务块（" + covered + "）");
      const cell = $$("#cal-grid .cal-cell")[10];
      cell.click();
      await wait(80);
      eq($("#modal-root").hidden, false, "点日历空白格新建任务");
      eq($$('.sheet input[type="date"]')[0].value, cell.dataset.date, "新建任务带上所点日期");
      $(".sheet-foot .btn-primary").click();
      await wait(80);

      // 9. 侧栏筛选与搜索
      $('.seg-btn[data-view="list"]').click();
      await wait(80);
      if ($("#btn-show-done").getAttribute("aria-pressed") !== "true") $("#btn-show-done").click();
      await wait(80);
      $$("#smart .smart-item")[1].click();
      await wait(80);
      eq($$("#smart .smart-item")[1].getAttribute("aria-pressed"), "true", "点「今天」后侧栏高亮生效");
      $$("#smart .smart-item")[0].click();
      await wait(80);
      const search = $("#search");
      search.value = "周报";
      fire(search, "input");
      await wait(80);
      eq($$(".task").length, 2, "搜索命中 2 条");
      search.value = "不存在的词";
      fire(search, "input");
      await wait(80);
      eq($$(".task").length, 0, "搜索无结果");
      search.value = "";
      fire(search, "input");
      await wait(80);

      // 10. 分组：新建 / 重命名
      $("#btn-add-group").click();
      await wait(80);
      const dlgInput = $("#dialog-root .input");
      truthy(dlgInput, "新建分组弹出输入框");
      dlgInput.value = "课外";
      $("#dialog-root .btn-primary").click();
      await wait(120);
      eq($$("#groups .group-item").length, 4, "分组增加到 4 个");

      // 11. 数据对话框能导出 JSON
      $("#btn-data").click();
      await wait(80);
      const exported = $("#dialog-root .textarea").value;
      truthy(exported.indexOf('"app": "miko.todo"') >= 0, "导出 JSON 可读");
      $("#dialog-root .dlg-actions .btn").click();
      await wait(60);

      // 12. 空任务关掉应被丢弃
      const before = $$(".task").length;
      $("#btn-new").click();
      await wait(80);
      $(".sheet-foot .btn-primary").click();
      await wait(120);
      eq($$(".task").length, before, "空任务关闭后被丢弃");

      // 13. 自定义重复：每 2 周的周五，共 3 次
      $("#btn-new").click();
      await wait(80);
      const t2 = $(".sheet-title");
      t2.value = "双周复盘";
      fire(t2, "input");
      let sels = $$(".sheet .select");
      sels[2].value = "custom";
      fire(sels[2], "change");
      await wait(80);
      let nums = $$(".sheet input[type=number]");
      nums[0].value = "2";
      fire(nums[0], "change");
      await wait(60);
      sels = $$(".sheet .select");
      sels[3].value = "week";
      fire(sels[3], "change");
      await wait(80);
      eq($$(".sheet .wd-btn").length, 7, "自定义周单位出现星期选择");
      $$(".sheet .wd-btn")[5].click();
      await wait(60);
      sels = $$(".sheet .select");
      sels[4].value = "count";
      fire(sels[4], "change");
      await wait(80);
      nums = $$(".sheet input[type=number]");
      nums[1].value = "3";
      fire(nums[1], "change");
      await wait(100);

      // 14. 导出回读验证 repeat 字段
      $("#btn-data").click();
      await wait(100);
      const dump = JSON.parse($("#dialog-root .textarea").value);
      const saved = dump.tasks.filter((x) => x.title === "双周复盘")[0];
      truthy(saved, "导出里能找到新任务");
      eq(saved.repeat.freq, "custom", "重复类型 custom");
      eq(saved.repeat.unit, "week", "重复单位 week");
      eq(saved.repeat.interval, 2, "重复间隔 2");
      eq(JSON.stringify(saved.repeat.weekdays), "[5]", "重复星期为周五");
      eq(saved.repeat.count, 3, "结束条件为 3 次");
      $("#dialog-root .dlg-actions .btn").click();
      await wait(80);
      $(".sheet-foot .btn-primary").click();
      await wait(80);

      // 15. 分组 ⋯ 菜单：重命名 + 删除
      let more = $(".group-item .g-more");
      more.click();
      await wait(80);
      eq($$(".menu .menu-item").length, 4, "分组菜单 4 个动作");
      $$(".menu .menu-item")[0].click();
      await wait(80);
      const renameInput = $("#dialog-root .input");
      renameInput.value = "工作（改名）";
      $("#dialog-root .btn-primary").click();
      await wait(150);
      truthy(($("#groups").textContent || "").indexOf("工作（改名）") >= 0, "分组重命名生效");

      const groupCountBefore = $$("#groups .group-item").length;
      $(".group-item .g-more").click();
      await wait(80);
      $$(".menu .menu-item")[3].click();
      await wait(120);
      $("#dialog-root .btn-danger").click();
      await wait(200);
      eq($$("#groups .group-item").length, groupCountBefore - 1, "删除分组后数量 -1");

      // 16. 日历翻月
      $('.seg-btn[data-view="calendar"]').click();
      await wait(120);
      const titleBefore = $("#cal-title").textContent;
      $("#cal-next").click();
      await wait(80);
      const titleNext = $("#cal-title").textContent;
      truthy(titleBefore !== titleNext, "日历翻到下个月（" + titleBefore + " → " + titleNext + "）");
      $("#cal-today").click();
      await wait(80);
      eq($("#cal-title").textContent, titleBefore, "回到本月");

      // 17. 空状态说人话 + 底部状态栏已移除
      $('.seg-btn[data-view="list"]').click();
      await wait(140);
      eq($(".statusbar"), null, "底部状态栏已移除");
      truthy($("#list-view").getBoundingClientRect().height > 200, "列表区占满剩余高度（" + Math.round($("#list-view").getBoundingClientRect().height) + "px）");
      const s2 = $("#search");
      s2.value = "zzzz";
      fire(s2, "input");
      await wait(140);
      truthy(($("#list-view").textContent || "").indexOf("没有匹配") >= 0, "搜索无结果时说明原因");
      const clearBtn = $("#list-view .empty-actions .btn");
      truthy(clearBtn, "空状态给出可点的出口：" + (clearBtn ? clearBtn.textContent : ""));
      clearBtn.click();
      await wait(140);
      eq(s2.value, "", "点清除搜索后输入框清空");
      truthy($$(".task").length > 0, "清除后任务回来了（" + $$(".task").length + "）");

      // 18. 勾完最后一个任务：说明「都完成了」+ 可撤销 + 可切回显示已完成
      if ($("#btn-show-done").getAttribute("aria-pressed") === "true") {
        $("#btn-show-done").click();
        await wait(140);
      }
      $("#btn-new").click();
      await wait(90);
      const onceTitle = $(".sheet-title");
      onceTitle.value = "一次性任务X";
      fire(onceTitle, "input");
      $(".sheet-foot .btn-primary").click();
      await wait(120);
      const s3 = $("#search");
      s3.value = "一次性任务X";
      fire(s3, "input");
      await wait(160);
      eq($$(".task").length, 1, "搜索定位到这条一次性任务");
      $(".task .check").click();
      await wait(180);
      truthy(($("#list-view").textContent || "").indexOf("都完成了") >= 0, "全部勾完后说明「都完成了」，不是空白");
      const undoBtn = $$("#toasts .toast-action").pop();
      truthy(undoBtn, "完成后给出撤销入口（" + (undoBtn ? undoBtn.textContent : "无") + "）");
      undoBtn.click();
      await wait(180);
      eq($$(".task").length, 1, "点撤销后任务回到未完成");
      $(".task .check").click();
      await wait(180);
      const showBtn = $("#list-view .empty-actions .btn");
      truthy(showBtn, "空状态给出「显示已完成」出口：" + (showBtn ? showBtn.textContent : "无"));
      showBtn.click();
      await wait(180);
      eq($$(".task[data-done='true']").length, 1, "点「显示已完成」后能看到这条已完成任务");

      // 19. 卡片交互：单击展开、卡片内新增子任务、优先级排序、进度、用时、详情入口
      const c19S4 = $("#search");
      c19S4.value = "";
      fire(c19S4, "input");
      await wait(120);
      if ($("#btn-show-done").getAttribute("aria-pressed") === "true") { $("#btn-show-done").click(); await wait(120); }
      $$("#smart .smart-item")[0].click();
      await wait(120);
      $('.seg-btn[data-view="list"]').click();
      await wait(120);
      $("#btn-new").click();
      await wait(90);
      const c19T3 = $(".sheet-title");
      c19T3.value = "卡片交互任务";
      fire(c19T3, "input");
      $(".sheet-foot .btn-primary").click();
      await wait(140);

      const c19Card = () => $$(".task").filter((c) => (c.querySelector(".task-title") || {}).textContent === "卡片交互任务")[0];
      const c19Name = (r) => { const i = r.querySelector(".sub-title"); return i ? i.value : (r.querySelector(".sub-title-text") || {}).textContent; };
      const c19Row = (title) => Array.from(c19Card().querySelectorAll(".sub-row")).filter((r) => c19Name(r) === title)[0];
      truthy(c19Card(), "新建的卡片在列表里");
      eq(!!c19Card().querySelector(".task-body"), false, "卡片默认收起");
      c19Card().querySelector(".task-title").click();
      await wait(100);
      eq(!!c19Card().querySelector(".task-body"), true, "单击卡片展开子任务");
      c19Card().querySelector(".task-title").click();
      await wait(100);
      eq(!!c19Card().querySelector(".task-body"), false, "再次单击收起");
      c19Card().querySelector(".task-title").click();
      await wait(100);

      const c19Add1 = c19Card().querySelector(".sub-add-input");
      c19Add1.value = "先做这个";
      fire(c19Add1, "input");
      c19Add1.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      await wait(160);
      eq(c19Card().querySelectorAll(".sub-row").length, 1, "卡片内回车新增子任务");
      const c19Add12 = c19Card().querySelector(".sub-add-input");
      c19Add12.value = "次要的";
      fire(c19Add12, "input");
      c19Add12.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      await wait(160);
      eq(c19Card().querySelectorAll(".sub-row").length, 2, "再添加一个子任务");

      // 收起态：只有标题 + 用时 + 优先级 + 箭头
      const cardChev = c19Card().querySelector("[data-act='expand'] svg.chevron path");
      eq(cardChev ? cardChev.getAttribute("d") : null, "M6 3.75 10.25 8 6 12.25", "任务卡片用 DBX 同款展开箭头");
      eq(!!c19Row("先做这个").querySelector(".sub-meta"), false, "子任务默认只显示标题行");
      eq(!!c19Row("先做这个").querySelector(".sub-title"), false, "收起态标题不是输入框（不可编辑）");
      truthy(!!c19Row("先做这个").querySelector(".sub-title-text"), "收起态标题是纯文本");
      eq(c19Row("先做这个").querySelector(".sub-dur").textContent, "—", "收起态用时显示占位");
      const subChev = c19Row("先做这个").querySelector(".sub-expand svg.chevron path");
      eq(subChev ? subChev.getAttribute("d") : null, "M6 3.75 10.25 8 6 12.25", "子任务箭头同款 path");
      eq(c19Row("先做这个").querySelector(".sub-expand").getAttribute("aria-expanded"), "false", "子任务默认收起");

      c19Row("先做这个").querySelector(".sub-title-text").click();
      await wait(180);
      eq(!!c19Row("先做这个").querySelector(".sub-meta"), true, "点标题展开详细字段");
      truthy(!!c19Row("先做这个").querySelector("input.sub-title"), "展开后标题变成可编辑输入框");
      truthy(!!c19Row("先做这个").querySelector(".sub-expand svg.chevron.open"), "展开后箭头旋转 90°");
      eq(c19Row("先做这个").querySelector(".sub-expand").getAttribute("aria-expanded"), "true", "箭头标记为展开");

      c19Row("次要的").querySelector(".sub-expand").click();
      await wait(180);
      const c19Pri = c19Row("次要的").querySelector(".sub-pri");
      c19Pri.value = "urgent";
      fire(c19Pri, "change");
      await wait(180);
      c19Row("次要的").querySelector(".sub-expand").click();
      await wait(180);
      truthy(!!c19Row("次要的").querySelector(".sub-right .chip"), "收起态右侧显示优先级标签");
      eq(!!c19Row("次要的").querySelector(".sub-meta"), false, "收起后详细字段隐藏");

      const c19Sort = c19Card().querySelector(".sort-select");
      c19Sort.value = "priority";
      fire(c19Sort, "change");
      await wait(160);
      eq(c19Name(c19Card().querySelector(".sub-row")), "次要的", "按优先级排序：紧急的排第一");
      const c19Sort2 = c19Card().querySelector(".sort-select");
      c19Sort2.value = "created";
      fire(c19Sort2, "change");
      await wait(160);
      eq(c19Name(c19Card().querySelector(".sub-row")), "先做这个", "按创建时间排序：最早的排第一");

      const c19Range = c19Row("先做这个").querySelector(".sub-range");
      c19Range.value = "50";
      fire(c19Range, "input");
      fire(c19Range, "change");
      await wait(160);
      eq(c19Row("先做这个").querySelector(".sub-pct").textContent, "50%", "子任务进度拖到 50%");
      eq(c19Card().querySelector(".task-progress .pct").textContent, "25%", "任务进度取两个子任务的平均值 25%");

      const c19Mins = c19Row("先做这个").querySelector(".sub-mins");
      c19Mins.value = "45";
      fire(c19Mins, "change");
      await wait(160);
      eq(c19Row("先做这个").querySelector(".sub-dur").textContent, "45 分钟", "手填用时生效");

      const c19Pad = (n) => String(n).padStart(2, "0");
      const c19Now = new Date();
      const c19Today = c19Now.getFullYear() + "-" + c19Pad(c19Now.getMonth() + 1) + "-" + c19Pad(c19Now.getDate());
      const c19Clear = c19Row("先做这个").querySelector(".sub-mins");
      c19Clear.value = "";
      fire(c19Clear, "change");
      await wait(150);
      const c19Date = c19Row("先做这个").querySelector('input[type="date"]');
      c19Date.value = c19Today;
      fire(c19Date, "change");
      await wait(150);
      const c19Time = c19Row("先做这个").querySelector('input[type="time"]');
      c19Time.value = "09:00";
      fire(c19Time, "change");
      await wait(150);
      const c19Done = c19Row("先做这个").querySelector(".sub-dt");
      c19Done.value = c19Today + "T10:30";
      fire(c19Done, "change");
      await wait(170);
      eq(c19Row("先做这个").querySelector(".sub-dur").textContent, "1 小时 30 分", "用时按 开始→完成 自动算");

      c19Card().querySelector("[data-act='edit']").click();
      await wait(140);
      eq($("#modal-root").hidden, false, "点 ✎ 打开详情面板");
      truthy($$("#modal-root .sub-row").length >= 2, "详情面板里也有子任务行（" + $$("#modal-root .sub-row").length + "）");
      $(".sheet-foot .btn-primary").click();
      await wait(120);
      eq($$(".task .sub-row").length >= 2, true, "详情关闭后卡片仍保持展开");

      eq(errors.length, 0, "无运行时报错" + (errors.length ? "：" + errors.join(" | ") : ""));
    } catch (e) {
      log("异常：" + (e && e.stack ? e.stack : String(e)), false);
    }

    lines.push("");
    lines.push("RESULT pass=" + pass + " fail=" + fail);
    out.textContent = lines.join("\n");
    document.title = fail ? "SELFTEST FAIL " + fail : "SELFTEST OK";
  });
})();
</script>
</body>
</html>
